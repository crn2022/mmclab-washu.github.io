<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Context-dependent computations for flexible social cognition</title>
  <desc id="desc">Faces and naturalistic video are interpreted under different task contexts, producing changes in population geometry, oscillatory coupling, and network configuration measured with intracranial recordings, eye tracking, and behavior.</desc>
