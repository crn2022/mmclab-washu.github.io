<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Multiscale neural coding from visual features to meaning</title>
  <desc id="desc">A conceptual pathway from faces and objects through ventral temporal, superior temporal, and medial temporal regions, linking axis-based visual codes to sparse meaningful representations across single-neuron, intracranial EEG, 7T fMRI, and 3T fMRI scales.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#486581"/>
    </marker>
  </defs>
  <rect width="1200" height="380" rx="28" fill="#f7fbfc"/>

  <text x="54" y="56" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43">Visual input</text>
  <rect x="54" y="86" width="190" height="264" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="112" cy="154" r="34" fill="#d9eef1" stroke="#147d92" stroke-width="3"/>
  <circle cx="101" cy="148" r="4" fill="#102a43"/>
  <circle cx="123" cy="148" r="4" fill="#102a43"/>
  <path d="M98 169 Q112 181 126 169" fill="none" stroke="#102a43" stroke-width="3" stroke-linecap="round"/>
  <rect x="157" y="126" width="48" height="48" rx="9" fill="#f7d794" stroke="#b7791f" stroke-width="3" transform="rotate(12 181 150)"/>
  <path d="M80 250 L110 211 L139 250 Z" fill="#8bd1d5" stroke="#147d92" stroke-width="3"/>
  <circle cx="174" cy="232" r="27" fill="#b9a7df" stroke="#6954a3" stroke-width="3"/>
  <rect x="84" y="276" width="112" height="34" rx="17" fill="#e8f5f6"/>
  <text x="140" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#243b53">faces · objects</text>

  <path d="M258 218 H332" stroke="#486581" stroke-width="5" marker-end="url(#arrow)"/>
  <polygon points="324,208 342,218 324,228" fill="#486581"/>
  <rect x="342" y="82" width="235" height="272" rx="24" fill="#ffffff" stroke="#8bc7d0" stroke-width="3"/>
  <text x="460" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#102a43">Ventral temporal</text>
  <text x="460" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#102a43">cortex</text>
  <text x="460" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#627d98">FG · ITG · LOC</text>
  <line x1="384" y1="190" x2="534" y2="190" stroke="#147d92" stroke-width="5"/>
  <line x1="384" y1="230" x2="508" y2="176" stroke="#2cb1bc" stroke-width="5"/>
  <line x1="384" y1="270" x2="525" y2="310" stroke="#6954a3" stroke-width="5"/>
  <circle cx="405" cy="182" r="8" fill="#147d92"/>
  <circle cx="445" cy="214" r="8" fill="#2cb1bc"/>
  <circle cx="496" cy="289" r="8" fill="#6954a3"/>
  <text x="460" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#147d92">Distributed feature axes</text>

  <path d="M590 218 H650" stroke="#486581" stroke-width="5" marker-end="url(#arrow)"/>
  <polygon points="642,208 660,218 642,228" fill="#486581"/>
  <rect x="660" y="82" width="196" height="272" rx="24" fill="#ffffff" stroke="#c7b9e5" stroke-width="3"/>
  <text x="758" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#102a43">Intermediate</text>
  <text x="758" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#102a43">circuit</text>
  <text x="758" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#627d98">STS · PHC · ErC</text>
  <circle cx="712" cy="211" r="18" fill="#d8cef0"/>
  <circle cx="758" cy="180" r="18" fill="#a996d5"/>
  <circle cx="806" cy="219" r="18" fill="#6954a3"/>
  <circle cx="740" cy="268" r="18" fill="#8bc7d0"/>
  <circle cx="793" cy="277" r="18" fill="#2cb1bc"/>
  <path d="M712 211 L758 180 L806 219 L793 277 L740 268 Z M712 211 L793 277 M758 180 L740 268" fill="none" stroke="#486581" stroke-width="3"/>
  <text x="758" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#6954a3">Local and long-range</text>
  <text x="758" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#6954a3">dynamics</text>

  <path d="M870 218 H920" stroke="#486581" stroke-width="5" marker-end="url(#arrow)"/>
  <polygon points="912,208 930,218 912,228" fill="#486581"/>
  <rect x="930" y="82" width="216" height="272" rx="24" fill="#ffffff" stroke="#f0b429" stroke-width="3"/>
  <text x="1038" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#102a43">Medial temporal</text>
  <text x="1038" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#102a43">lobe</text>
  <text x="1038" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#627d98">amygdala · hippocampus</text>
  <ellipse cx="995" cy="218" rx="34" ry="24" fill="#fff0c7" stroke="#d99a00" stroke-width="3"/>
  <ellipse cx="1066" cy="199" rx="36" ry="24" fill="#f8d98f" stroke="#d99a00" stroke-width="3"/>
  <ellipse cx="1080" cy="264" rx="37" ry="25" fill="#f0b429" opacity="0.75" stroke="#b7791f" stroke-width="3"/>
  <circle cx="1009" cy="286" r="18" fill="#f7d794" stroke="#b7791f" stroke-width="3"/>
  <text x="1038" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a46700">Region and sparse</text>
  <text x="1038" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a46700">codes</text>

</svg>
